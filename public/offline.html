<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF8FC" />
<title>SoulConnect · Offline</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 24px;
    font-family:'Plus Jakarta Sans',Inter,system-ui,-apple-system,sans-serif;color:#221B3A;text-align:center;
    background:linear-gradient(180deg,#F3EFF9 0%,#FAF8FC 60%)}
  .card{max-width:360px;padding:32px 24px;border-radius:28px;border:1.5px solid transparent;
    background:linear-gradient(#fff,#fff) padding-box,linear-gradient(150deg,#D4B07A,#E7D3E4 45%,#9C86CC) border-box;
    box-shadow:0 18px 44px rgba(107,79,160,.10)}
  img{width:96px;height:96px;border-radius:24px;margin-bottom:16px}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin-bottom:10px}
  p{font-size:15px;line-height:1.6;color:#5B5470}
  button{margin-top:22px;border:0;border-radius:14px;padding:13px 22px;background:#6B4FA0;color:#fff;
    font:700 15px inherit;font-family:inherit;cursor:pointer}
  .help{margin-top:18px;font-size:13px;color:#6E6784}
  .help a{color:#6B4FA0;font-weight:700;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="SoulConnect" />
    <h1>You are offline</h1>
    <p>SoulConnect needs a connection to reach your people. Take a slow breath, and try again when you are back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="help">Need to talk to someone now? Call Tele MANAS <a href="tel:14416">14416</a></p>
  </div>
</body>
</html>
